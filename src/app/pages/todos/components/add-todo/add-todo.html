<div class="w-full rounded-xl bg-white shadow p-4 flex flex-col gap-4">
  <h1 class="text-xl font-semibold">Add Todo</h1>
  <input
    type="text"
    placeholder="Enter a title"
    [(ngModel)]="title"
    class="w-full p-2 border rounded-lg"
  />
  <button
    class="py-2 px-4 rounded-lg bg-blue-500 text-base font-medium cursor-pointer text-white hover:bg-blue-400"
    (click)="addTodo()"
  >
    + Add
  </button>
</div>
